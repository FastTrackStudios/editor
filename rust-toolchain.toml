# Matches the FastTrackStudio fleet pin (devenv-fleet's pins.json). The dev
# shell's rustc is this channel, through devenv-fleet's rust module.
#
# CI still builds through the repo flake (`nix develop .#ci`), whose
# nix/modules/toolchain.nix stays at 1.94.0: its rust-overlay follows
# dioxus-flake, and the locked revision has no 1.99.1. Keep the two in step
# when that flake moves.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy", "rust-src"]
targets = ["wasm32-unknown-unknown"]
