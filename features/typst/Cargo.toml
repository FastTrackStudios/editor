[package]
name = "editor-typst"
description = "Typst rendering + PDF export for the Editor. Wraps the typst crate with an in-memory World, bundled fonts, and `compile_svg` / `compile_pdf` helpers tuned for embedding in a live-preview markdown editor."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
# Core engine. Pinning the trio to the same minor version is
# important — typst's API still moves between point releases.
typst = "0.13"
typst-svg = "0.13"
typst-pdf = "0.13"
typst-assets = { version = "0.13", features = ["fonts"] }
# `comemo` is the salsa-style memoization layer typst caches
# through. Sharing it with typst's own version is required.
comemo = "0.4"
ecow = "0.2"
# `send_wrapper` is the typst-typist trick for stuffing
# !Send/!Sync state into a struct that typst expects to be Send —
# we hold the World inside one. Same as obsidian-typst does it.
send_wrapper = "0.6"
parking_lot = "0.12"
# `wasmbind` routes `chrono::Local::now()` through `Date.now()`
# on `wasm32-unknown-unknown` — without it the call panics with
# "time not implemented on this platform". Brings in `js-sys` +
# `wasm-bindgen` transitively.
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }
thiserror = { workspace = true }
tracing = { workspace = true }

[features]
default = []

[lints]
workspace = true
