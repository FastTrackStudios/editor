[package]
name = "editor-crdt"
description = "Adapter between the editor's byte-offset Changes and the scalar-indexed TextOp stream architect's crdt lib applies to a LoroText container."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

# Deliberately NO dependency on the architect repo. The canonical
# `TextOp` lives at `architect/libs/crdt/src/codec.rs`; this crate
# mirrors it (see `src/lib.rs` for the full rationale) because:
#
# - This workspace builds standalone — sibling repos are reached via
#   codeberg git deps, never `path` (see the engraver/keyflow-text
#   notes in the root Cargo.toml).
# - A *feature-gated* path dep doesn't help: cargo resolves the path
#   (and a path dev-dependency) during workspace metadata even when
#   the feature is off, so any clone without `../architect` checked
#   out next door would fail to build at all.
# - architect's crdt crate drags loro + loro-internal + tokio +
#   crdt-derive into the graph — far too heavy for a pure offset
#   translation layer that must also stay wasm-clean.
#
# The mirror is two enum variants; conversion at the host is a
# two-arm match. Equivalence against the real loro `apply_text_ops`
# semantics is covered by this crate's sequential-post-state
# simulator tests (and was cross-checked against the real crate —
# see the adapter notes in the lib docs).

[dependencies]
editor-state = { workspace = true }
ropey = { workspace = true }

[lints]
workspace = true
