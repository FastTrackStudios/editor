[package]
name = "editor-view"
description = "Dioxus view layer for the Editor — <Editor> component, contenteditable bridge."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
editor-state = { workspace = true }
editor-vim = { workspace = true }
dioxus = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { version = "1", features = ["v7", "js"] }
# Native caret movement walks the doc's rope by char/line (the web path
# delegates this to contenteditable). `Doc::rope()` hands back a
# `&ropey::Rope`, so we name the type directly here.
ropey = { workspace = true }

# Renderer seam. `web` (default) is the contenteditable + `document::eval`
# bridge path that drives both the wasm browser build and the desktop
# webview — a real DOM does the text editing and our JS bridge observes
# it. `native` is the Blitz / `dioxus-native` path: no contenteditable, no
# JS engine, so the component renders the tile tree as rsx (`tile::render_dx`),
# paints its own caret, and drives `editor-state` directly from key/mouse
# events. The two are mutually exclusive within a single binary — a build
# selects one renderer.
[features]
default = ["web"]
web = []
native = []

# wasm-only: `performance.now()` for our perf spans (the std
# `Instant::now` traps on wasm32-unknown-unknown).
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Performance", "Document", "Element", "HtmlElement", "DomStringMap", "MediaQueryList"] }

[dev-dependencies]
# Headless component tests on blitz-dom — native-feature builds only
# (`cargo test -p editor-view --no-default-features --features native`).
dioxus-test = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
