[package]
name = "editor-view"
description = "Dioxus view layer for the Editor — <Editor> component, contenteditable bridge."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
editor-state = { workspace = true }
editor-vim = { workspace = true }
dioxus = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { version = "1", features = ["v7", "js"] }
# Native caret movement walks the doc's rope by char/line (the web path
# delegates this to contenteditable). `Doc::rope()` hands back a
# `&ropey::Rope`, so we name the type directly here.
ropey = { workspace = true }

# The native viewport poll's tick channel (see `virtual_lines::ticker`).
# Not target-gated: both build on wasm, where a build with `native` on
# (keyflow's wasm check unifies features) would otherwise miss them.
futures-channel = { version = "0.3", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }

# Renderer seam. `web` (default) is the contenteditable + `document::eval`
# bridge path that drives both the wasm browser build and the desktop
# webview — a real DOM does the text editing and our JS bridge observes
# it. `native` is the Blitz / `dioxus-native` path: no contenteditable, no
# JS engine, so the component renders the tile tree as rsx (`tile::render_dx`),
# paints its own caret, and drives `editor-state` directly from key/mouse
# events. The two are mutually exclusive within a single binary — a build
# selects one renderer.
[features]
default = ["web"]
web = []
# Native line virtualization polls the scroll position on a timer (Blitz
# sends no scroll events). The timer is a thread feeding a channel, so it
# runs on any executor (`virtual_lines::ticker`), not only under Tokio.
native = ["dep:futures-channel", "dep:futures-util"]

# wasm-only: `performance.now()` for our perf spans (the std
# `Instant::now` traps on wasm32-unknown-unknown).
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Performance", "Document", "Element", "HtmlElement", "DomStringMap", "MediaQueryList"] }



[dev-dependencies]
# Wheel events for the scroll tests (a Blitz UiEvent, as the window shell sends).
blitz-traits = { workspace = true }
# Headless component tests on blitz-dom — native-feature builds only
# (`cargo test -p editor-view --no-default-features --features native`).
dioxus-test = { workspace = true }
tokio = { workspace = true }
# The formatting document has math, Typst and Mermaid fences. The
# `editor` facade turns these on for the playground; the tests need the
# same renderers or they measure source text, not what a user sees.
editor-state = { workspace = true, features = ["typst", "mermaid"] }
# Decodes the PNGs `DocumentTester::render_png` writes, so the caret tests
# can check what is painted, not only what the DOM says is there.
png = "0.17"

[lints]
workspace = true
