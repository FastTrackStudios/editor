# editor — the one PR/push gate.
#
# Toolchain comes from the repo flake: every step runs under
# `nix develop .#ci -c`. `--accept-flake-config` picks up the
# fasttrackstudio.cachix.org substituter from flake.nix nixConfig.
#
# Deliberately simpler than the task gate it replaces: that one drove
# `cargo rail plan` to pick affected crates out of a large workspace, and
# built tailwind sheets for four apps. This workspace is eleven crates
# with no CSS pipeline — just build it.

name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NIX_DEV: nix develop --accept-flake-config .#ci -c

jobs:
  check:
    name: Build + test
    # The repo's own self-hosted runner on THEBATTLESHIP (NixOS, nix
    # preinstalled). The build tree persists in $CI_CACHE_DIR between runs,
    # which replaces the rust-cache round trip.
    runs-on: [self-hosted, editor]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Persistent target dir
        run: |
          dir="${CI_CACHE_DIR:-$HOME/cargo-target}/checks"
          mkdir -p "$dir"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
          echo "target dir: $dir ($(du -sh "$dir" 2>/dev/null | cut -f1))"
      - name: Manifests + lockfile
        run: ${NIX_DEV} cargo metadata --locked --format-version 1 > /dev/null
      - name: cargo fmt --check
        run: ${NIX_DEV} cargo fmt --all --check
      - name: cargo check --workspace
        run: ${NIX_DEV} cargo check --workspace --all-targets
      # The editor runs in the browser as much as on the desktop, and a
      # host build compiles neither the wasm cfg blocks nor the web
      # renderer. `playground --features web` is the smallest thing that
      # exercises both.
      - name: cargo check (wasm)
        run: |
          ${NIX_DEV} cargo check -p playground \
            --target wasm32-unknown-unknown \
            --no-default-features --features web
      - name: cargo nextest
        run: ${NIX_DEV} cargo nextest run --workspace --no-fail-fast
