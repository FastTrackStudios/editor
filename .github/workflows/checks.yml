name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: apt deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libasound2-dev libudev-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # apps/{web,desktop,mobile}/assets/tailwind.css are GENERATED, not
      # committed, and asset!() resolves them at compile time — so they have
      # to exist before cargo runs. dx builds them during `dx serve`/`dx
      # build`, but CI drives plain cargo.
      - uses: taiki-e/install-action@just
      - name: tailwind
        run: |
          npm install -g @tailwindcss/cli
          just --justfile apps/Justfile --working-directory apps css

      - name: fmt
        run: cargo fmt --all -- --check

      - name: check
        run: cargo check --workspace --all-targets

      - name: clippy
        run: cargo clippy --workspace --all-targets

      - name: test
        run: cargo test --workspace

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # Same reason as the native job: asset!() needs the generated sheets.
      - uses: taiki-e/install-action@just
      - name: tailwind
        run: |
          npm install -g @tailwindcss/cli
          just --justfile apps/Justfile --working-directory apps css

      # The browser build is a first-class target: the UI crate and the
      # vault/proto slices must stay wasm-clean or the web app stops building.
      - name: check wasm
        run: cargo check --target wasm32-unknown-unknown -p ui -p task-ui-core
