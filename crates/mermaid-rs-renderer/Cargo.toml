[package]
edition = "2024"
name = "mermaid-rs-renderer"
version = "0.2.2"
build = false
exclude = [
    "node_modules/",
    "tmp/",
    "docs/",
    "scripts/",
    ".github/",
    "package.json",
    "package-lock.json",
    "*.png",
    "*.html",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Fast Mermaid diagram renderer in pure Rust - 23 diagram types, 100-1400x faster than mermaid-cli"
homepage = "https://github.com/1jehuang/mermaid-rs-renderer"
readme = "README.md"
keywords = [
    "mermaid",
    "diagram",
    "svg",
    "renderer",
    "cli",
]
categories = [
    "command-line-utilities",
    "visualization",
]
license = "MIT"
repository = "https://github.com/1jehuang/mermaid-rs-renderer"

[features]
cli = ["dep:clap"]
default = [
    "cli",
    "png",
]
png = [
    "dep:resvg",
    "dep:usvg",
]

[lib]
name = "mermaid_rs_renderer"
path = "src/lib.rs"

[[bin]]
name = "mmdr"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "layout_suite"
path = "tests/layout_suite.rs"

[[bench]]
name = "renderer"
path = "benches/renderer.rs"
harness = false

[dependencies.anyhow]
version = "1.0"

# `web-time` is a drop-in replacement for `std::time::Instant`
# that works on `wasm32-unknown-unknown`. Locally vendored
# patch: the upstream crate calls `Instant::now()` from inside
# `compute_layout` (not feature-gated), which panics on the web.
[dependencies.web-time]
version = "1"

[dependencies.clap]
version = "4.5"
features = ["derive"]
optional = true

[dependencies.fontdb]
version = "0.23"

[dependencies.json5]
version = "1.3"

[dependencies.once_cell]
version = "1.19"

[dependencies.regex]
version = "1.12"

[dependencies.resvg]
version = "0.46"
optional = true

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.serde_json]
version = "1.0"

[dependencies.thiserror]
version = "2.0"

[dependencies.ttf-parser]
version = "0.25"

[dependencies.usvg]
version = "0.46"
optional = true

[dev-dependencies.criterion]
version = "0.8"
