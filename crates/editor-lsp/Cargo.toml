[package]
name = "editor-lsp"
description = "Host-side LSP client: framed JSON-RPC over a spawned language server, incremental didChange from editor-state Changes, and diagnostics mapped back to byte ranges."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

# Deliberately NO dependency on editor-view or dioxus. The client is a
# pure tokio + editor-state library the *host* owns: it consumes the
# same data a `TransactionEvent` carries (`Changes` + `doc_before`),
# but takes them as plain arguments so the crate stays UI-free and can
# later run under a websocket proxy for wasm hosts.
#
# tokio and lsp-types are declared here rather than in the workspace
# dependency table because no other crate uses them — the workspace
# root stays untouched beyond the members list.

[dependencies]
editor-state = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# Protocol types only — we write the JSON-RPC client ourselves (see
# src/transport.rs); tower-lsp and friends are server-side frameworks.
lsp-types = "0.97"

# Host-side only (desktop/native). `process` + `io-util` drive the
# stdio child transport; `sync` provides the channel plumbing the
# transport abstraction is built from.
tokio = { version = "1", features = ["process", "io-util", "sync", "rt", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = [
    "process",
    "io-util",
    "sync",
    "rt-multi-thread",
    "macros",
    "time",
] }

[lints]
workspace = true
