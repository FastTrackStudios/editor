# Dioxus CLI config — applies workspace-wide unless overridden.
#
# Default `dx serve` opens the desktop webview window. Add
# `--platform web` to target the browser instead.
#
# Examples:
#   dx serve                       # desktop (default)
#   dx serve --platform web        # browser at http://localhost:8080

[application]
name = "playground"
default_platform = "desktop"

[web.app]
title = "Editor"

[web.watcher]
reload_html = true
watch_path = ["crates", "examples"]
